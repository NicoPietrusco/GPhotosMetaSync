[project]
name = "gphotometasync"
version = "0.1.0"
description = "Google Photos Metadata Synchronizer - Extract and embed EXIF data"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["google-photos", "metadata", "exif", "photos", "sync"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pillow>=12.0.0",
    "typer>=0.12.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
]
heic = [
    "pillow-heif>=0.15.0",
]

[project.scripts]
gphotometasync = "src.gphotometasync.main:app"
gphotometasync-gui = "src.gphotometasync.gui:main"

[project.urls]
Homepage = "https://github.com/yourusername/GPhotoMetaSync"
Repository = "https://github.com/yourusername/GPhotoMetaSync.git"
Issues = "https://github.com/yourusername/GPhotoMetaSync/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gphotometasync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "Q"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.uv.sources]
gphotometasync = { workspace = true }

[dependency-groups]
dev = [
    "gphotometasync",
]
