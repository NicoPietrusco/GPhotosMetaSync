name: Release desktop apps

# Called by release-please.yml once it has created the release. Run it by hand to build the
# apps without publishing them, or to attach them again to an existing release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the apps to
        required: true
        type: string
    secrets:
      GOOGLE_OAUTH_CLIENT_JSON:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the apps to (leave empty to only build)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS-arm64
            arch: arm64
          - os: macos-15-intel
            name: macOS-x64
            arch: x64
          - os: windows-2022
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # A cache written by PR runs must never feed a release build.
          enable-cache: false
      - name: Install locked build tools
        run: uv sync --group dev --locked
      - name: Check the tag matches the package version
        if: inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(uv run python -c 'from importlib.metadata import version; print(version("hicpicnunc"))')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package version ${version} in pyproject.toml"
            exit 1
          fi
      - name: Run quality checks
        run: |
          uv run ruff check src/ tests/
          uv run ty check src/
          uv run pytest
      - name: Add the release OAuth client
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          test -n "$GOOGLE_OAUTH_CLIENT_JSON"
          mkdir -p credentials
          printf '%s' "$GOOGLE_OAUTH_CLIENT_JSON" > credentials/client_secrets.json
      - name: Build application
        run: uv run pyinstaller --noconfirm --clean packaging/pyinstaller.spec
      - name: Smoke-test the bundle
        # Launches the real windowed app: catches crashes that only happen once frozen.
        run: uv run python scripts/smoke_test_bundle.py dist
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
        run: hdiutil create -volname "Hic Pic Nunc" -srcfolder "dist/Hic Pic Nunc.app" -ov -format UDZO "dist/HicPicNunc-macOS-${ARCH}.dmg"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist\Hic Pic Nunc\*' -DestinationPath 'dist\HicPicNunc-Windows-x64.zip'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      # release-please creates the release, this job only attaches the apps to it.
      - name: Attach the apps to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "${TAG}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
