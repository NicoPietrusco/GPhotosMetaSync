name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS-arm64
            arch: arm64
          - os: macos-15-intel
            name: macOS-x64
            arch: x64
          - os: windows-2022
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install locked build tools
        run: uv sync --group dev --frozen
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(uv run python -c 'from importlib.metadata import version; print(version("hicpicnunc"))')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${version} in pyproject.toml"
            exit 1
          fi
      - name: Run quality checks
        run: |
          uv run ruff check src/ tests/
          uv run ty check src/
          uv run pytest
      - name: Add the release OAuth client
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          test -n "$GOOGLE_OAUTH_CLIENT_JSON"
          mkdir -p credentials
          printf '%s' "$GOOGLE_OAUTH_CLIENT_JSON" > credentials/client_secrets.json
      - name: Build application
        run: uv run pyinstaller --noconfirm --clean packaging/pyinstaller.spec
      - name: Smoke-test the bundle
        # Launches the real windowed app: catches crashes that only happen once frozen.
        run: uv run python scripts/smoke_test_bundle.py dist
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname "Hic Pic Nunc" -srcfolder "dist/Hic Pic Nunc.app" -ov -format UDZO "dist/HicPicNunc-macOS-${{ matrix.arch }}.dmg"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist\Hic Pic Nunc\*' -DestinationPath 'dist\HicPicNunc-Windows-x64.zip'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes