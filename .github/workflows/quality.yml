name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Same platforms as the desktop releases, so OS-specific failures show up in PRs.
        os: [ubuntu-latest, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install locked development tools
        run: uv sync --group dev --frozen
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Type check
        run: uv run ty check src/
      - name: Test
        run: uv run pytest
