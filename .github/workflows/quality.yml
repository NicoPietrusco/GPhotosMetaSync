name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Same platforms as the desktop releases, so OS-specific failures show up in PRs.
        os: [ubuntu-latest, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked development tools
        run: uv sync --group dev --frozen
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Type check
        run: uv run ty check src/
      - name: Test
        run: uv run pytest

  workflows:
    name: audit workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install locked development tools
        run: uv sync --group dev --frozen
      - name: Run zizmor
        env:
          # Enables the online audits, such as known-vulnerable actions and impostor commits.
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor --format github .github
