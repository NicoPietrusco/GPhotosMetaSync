<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPhotoMetaSync</title>
    <link rel="stylesheet" href="/static/css/picker.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 GPhotoMetaSync</h1>
            <p>Select and manage your Google Photos</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="authenticate()" id="auth-btn">
                🔐 Sign In
            </button>
            <button class="btn btn-success" onclick="openPicker()" id="picker-btn" disabled>
                📁 Select Photos
            </button>
            <button class="btn" onclick="loadSelectedPhotos()" id="refresh-btn" style="display: none;">
                🔄 Refresh
            </button>
        </div>

        <div id="status" class="status"></div>

        <div id="photos-container" class="photos-container">
            <div class="photos-header">
                <h2>Selected Photos</h2>
                <div class="photo-count" id="photo-count">0 photos</div>
            </div>
            <div id="photos-content"></div>
        </div>
    </div>

    <script src="/static/js/picker.js"></script>
</body>
</html>
